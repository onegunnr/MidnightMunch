<svg xmlns="http://www.w3.org/2000/svg" viewBox="-45 -40 90 80" width="90" height="80">
  <defs>
    <linearGradient id="sweeperChassis" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1c2538" />
      <stop offset="70%" stop-color="#2d3a54" />
      <stop offset="100%" stop-color="#182030" />
    </linearGradient>
    <radialGradient id="brushGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a202c" />
      <stop offset="60%" stop-color="#4a5568" />
      <stop offset="90%" stop-color="#718096" />
      <stop offset="100%" stop-color="#cbd5e0" />
    </radialGradient>
    <filter id="sweeperShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#070914" flood-opacity="0.6" />
    </filter>
  </defs>

  <g filter="url(#sweeperShadow)">
    <!-- Heavy Industrial Wheels -->
    <rect x="-32" y="-35" width="18" height="9" rx="3" fill="#11131c" stroke="#374151" stroke-width="1.5" />
    <rect x="-32" y="26" width="18" height="9" rx="3" fill="#11131c" stroke="#374151" stroke-width="1.5" />
    <rect x="2" y="-35" width="18" height="9" rx="3" fill="#11131c" stroke="#374151" stroke-width="1.5" />
    <rect x="2" y="26" width="18" height="9" rx="3" fill="#11131c" stroke="#374151" stroke-width="1.5" />

    <!-- Wide Body Hopper -->
    <rect x="-36" y="-28" width="60" height="56" rx="10" fill="url(#sweeperChassis)" stroke="#4b5563" stroke-width="2" />

    <!-- Hazard Chevron Bar across rear -->
    <path d="M -34,-26 L -26,-26 L -18,-16 L -26,-16 Z" fill="#fbbf24" />
    <path d="M -26,-26 L -18,-26 L -10,-16 L -18,-16 Z" fill="#1f2937" />
    <path d="M -34,16 L -26,16 L -18,26 L -26,26 Z" fill="#fbbf24" />
    <path d="M -26,16 L -18,16 L -10,26 L -18,26 Z" fill="#1f2937" />

    <!-- Front Arms for Sweeper Brushes -->
    <rect x="18" y="-24" width="12" height="7" rx="2" fill="#374151" />
    <rect x="18" y="17" width="12" height="7" rx="2" fill="#374151" />

    <!-- Dual Front Rotary Sweeper Brushes (+X is front) -->
    <!-- Top Brush -->
    <circle cx="28" cy="-20" r="15" fill="url(#brushGrad)" stroke="#6b7280" stroke-width="1.5" />
    <circle cx="28" cy="-20" r="4" fill="#d97706" />
    <line x1="28" y1="-35" x2="28" y2="-5" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="2,2" />
    <line x1="13" y1="-20" x2="43" y2="-20" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="2,2" />

    <!-- Bottom Brush -->
    <circle cx="28" cy="20" r="15" fill="url(#brushGrad)" stroke="#6b7280" stroke-width="1.5" />
    <circle cx="28" cy="20" r="4" fill="#d97706" />
    <line x1="28" y1="5" x2="28" y2="35" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="2,2" />
    <line x1="13" y1="20" x2="43" y2="20" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="2,2" />

    <!-- Vacuum Intake Nozzle in between brushes -->
    <rect x="18" y="-10" width="14" height="20" rx="3" fill="#111827" stroke="#fbbf24" stroke-width="1.5" />

    <!-- Dual Amber Flashing Light Beacons -->
    <circle cx="-10" cy="-18" r="6" fill="#f59e0b" stroke="#fef3c7" stroke-width="1.2" />
    <circle cx="-10" cy="-18" r="3" fill="#ffffff" />
    <circle cx="-10" cy="18" r="6" fill="#f59e0b" stroke="#fef3c7" stroke-width="1.2" />
    <circle cx="-10" cy="18" r="3" fill="#ffffff" />
  </g>
</svg>
