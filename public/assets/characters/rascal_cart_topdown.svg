<svg xmlns="http://www.w3.org/2000/svg" viewBox="-65 -45 130 90" width="130" height="90">
  <defs>
    <linearGradient id="cartBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1ba3a3" />
      <stop offset="60%" stop-color="#4de8dc" />
      <stop offset="100%" stop-color="#24b5b5" />
    </linearGradient>
    <linearGradient id="cartTrim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2f1c5c" />
      <stop offset="100%" stop-color="#5a399e" />
    </linearGradient>
    <linearGradient id="yellowHelmet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffea6c" />
      <stop offset="70%" stop-color="#f5b325" />
      <stop offset="100%" stop-color="#d68c0b" />
    </linearGradient>
    <linearGradient id="scarfGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#e274bf" />
      <stop offset="100%" stop-color="#9a3482" />
    </linearGradient>
    <filter id="cartShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#090724" flood-opacity="0.6" />
    </filter>
  </defs>

  <g filter="url(#cartShadow)">
    <!-- Raccoon Striped Tail -->
    <path d="M -16,3 C -28,12 -42,16 -58,10 C -64,7 -65,-3 -58,-6 C -48,-11 -32,-8 -16,-3 Z" fill="#222842" />
    <path d="M -26,8 C -30,4 -31,-3 -26,-6 L -31,-6 C -37,-3 -36,6 -31,9 Z" fill="#e8eef8" opacity="0.95" />
    <path d="M -39,12 C -44,8 -45,-1 -40,-7 L -44,-6 C -50,-1 -49,8 -44,11 Z" fill="#e8eef8" opacity="0.95" />
    <path d="M -52,10 C -56,6 -57,1 -53,-4 L -56,-3 C -60,0 -59,5 -56,8 Z" fill="#e8eef8" opacity="0.95" />
    <path d="M -58,10 C -64,7 -65,-3 -58,-6 C -55,-4 -54,6 -58,10 Z" fill="#151728" />

    <!-- Wheels (4 Top-Down Tire Treads) -->
    <rect x="-18" y="-36" width="16" height="8" rx="3" fill="#1b1c2b" stroke="#353754" stroke-width="1.5" />
    <rect x="-18" y="28" width="16" height="8" rx="3" fill="#1b1c2b" stroke="#353754" stroke-width="1.5" />
    <rect x="22" y="-35" width="16" height="7" rx="3" fill="#1b1c2b" stroke="#353754" stroke-width="1.5" />
    <rect x="22" y="28" width="16" height="7" rx="3" fill="#1b1c2b" stroke="#353754" stroke-width="1.5" />

    <!-- Turquoise Snack Cart Body -->
    <rect x="-16" y="-28" width="62" height="56" rx="14" fill="url(#cartBody)" stroke="#167d7d" stroke-width="2" />
    <path d="M -16,-18 L 44,-18 L 44,-12 L -16,-12 Z" fill="url(#cartTrim)" />
    <path d="M -16,12 L 44,12 L 44,18 L -16,18 Z" fill="url(#cartTrim)" />
    <rect x="-20" y="-14" width="6" height="28" rx="2" fill="#322254" />

    <!-- Popcorn Hopper Basket -->
    <rect x="24" y="-20" width="22" height="40" rx="5" fill="#151a30" stroke="#fce37e" stroke-width="1.5" />
    <circle cx="28" cy="-12" r="4.5" fill="#fff5cb" stroke="#e0b84c" stroke-width="0.8" />
    <circle cx="35" cy="-13" r="5" fill="#ffeaa3" stroke="#e0b84c" stroke-width="0.8" />
    <circle cx="41" cy="-11" r="4" fill="#fff6d6" stroke="#e0b84c" stroke-width="0.8" />
    <circle cx="28" cy="-3" r="5" fill="#fff7d9" stroke="#e0b84c" stroke-width="0.8" />
    <circle cx="36" cy="0" r="5.5" fill="#ffe794" stroke="#e0b84c" stroke-width="0.8" />
    <circle cx="42" cy="-1" r="4.5" fill="#fff6d6" stroke="#e0b84c" stroke-width="0.8" />
    <circle cx="29" cy="8" r="5" fill="#ffeeb2" stroke="#e0b84c" stroke-width="0.8" />
    <circle cx="36" cy="11" r="4.5" fill="#fff7d9" stroke="#e0b84c" stroke-width="0.8" />
    <circle cx="42" cy="9" r="4" fill="#ffe999" stroke="#e0b84c" stroke-width="0.8" />

    <!-- Rascal's Seat & Body -->
    <ellipse cx="2" cy="0" rx="14" ry="17" fill="#462c7d" stroke="#2a1752" stroke-width="1.5" />
    <circle cx="18" cy="-13" r="3.8" fill="#5a399e" stroke="#2a1752" stroke-width="1" />
    <circle cx="18" cy="13" r="3.8" fill="#5a399e" stroke="#2a1752" stroke-width="1" />

    <!-- Trailing Purple Silk Scarf -->
    <path d="M -5,-7 C -16,-16 -28,-14 -40,-24 C -37,-18 -26,-11 -12,-4 Z" fill="url(#scarfGrad)" opacity="0.95" />
    <path d="M -4,-3 C -18,-9 -30,-6 -44,-14 C -40,-9 -28,-3 -10,1 Z" fill="#d95db3" opacity="0.85" />

    <!-- Rascal's Head & Oversized Yellow Delivery Helmet -->
    <ellipse cx="5" cy="0" rx="16" ry="16" fill="url(#yellowHelmet)" stroke="#bf7906" stroke-width="1.5" />
    <path d="M 12,-12 C 22,-7 22,7 12,12 C 16,5 16,-5 12,-12 Z" fill="#d48206" />
    <path d="M 14,-10 C 18,-14 23,-13 25,-9 C 22,-8 19,-6 15,-6 Z" fill="#f8f4e6" />
    <path d="M 2,-16 C 0,-23 8,-23 9,-15 Z" fill="#2b314f" stroke="#161829" stroke-width="1" />
    <path d="M 3,-17 C 3,-20 6,-20 7,-16 Z" fill="#f2ecdb" />
    <path d="M 2,16 C 0,23 8,23 9,15 Z" fill="#2b314f" stroke="#161829" stroke-width="1" />
    <path d="M 3,17 C 3,20 6,20 7,16 Z" fill="#f2ecdb" />
    <path d="M -11,0 C -11,-3 15,-3 15,0 C 15,3 -11,3 -11,0 Z" fill="#ffffff" opacity="0.65" />
    <ellipse cx="1" cy="-8" rx="8" ry="4" fill="#ffffff" opacity="0.45" transform="rotate(-15, 1, -8)" />
  </g>
</svg>
