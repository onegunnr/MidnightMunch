<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" width="280" height="280">
  <defs>
    <radialGradient id="menuHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4e3382" />
      <stop offset="70%" stop-color="#2c1a52" />
      <stop offset="100%" stop-color="#181347" />
    </radialGradient>
    <linearGradient id="pYellowHelmet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff27d" />
      <stop offset="50%" stop-color="#ffbf24" />
      <stop offset="100%" stop-color="#d47e06" />
    </linearGradient>
    <linearGradient id="pScarf" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#f274cb" />
      <stop offset="100%" stop-color="#932b77" />
    </linearGradient>
    <linearGradient id="pJacket" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a3bb0" />
      <stop offset="100%" stop-color="#2d1763" />
    </linearGradient>
    <filter id="portraitDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#080617" flood-opacity="0.75" />
    </filter>
  </defs>

  <!-- Circular Portal / Backdrop Frame -->
  <circle cx="140" cy="140" r="130" fill="url(#menuHalo)" stroke="#ffcf57" stroke-width="5" />
  <circle cx="140" cy="140" r="122" fill="none" stroke="#68e2d7" stroke-width="2" opacity="0.4" />

  <!-- Carnival Sparkle Stars in Backdrop -->
  <g fill="#ffd65a" opacity="0.8">
    <polygon points="45,60 48,68 56,71 48,74 45,82 42,74 34,71 42,68" />
    <polygon points="230,85 233,91 239,94 233,97 230,103 227,97 221,94 227,91" />
    <polygon points="65,190 67,195 72,197 67,199 65,204 63,199 58,197 63,195" />
    <polygon points="215,185 217,190 222,192 217,194 215,199 213,194 208,192 213,190" />
  </g>

  <g filter="url(#portraitDrop)">
    <!-- Striped Raccoon Tail Swishing up on right -->
    <g transform="translate(180, 150) rotate(22)">
      <path d="M 0,20 C 35,10 65,-10 60,-50 C 56,-75 25,-70 18,-45 C 10,-20 -5,-5 0,20 Z" fill="#242b47" stroke="#141829" stroke-width="2" />
      <path d="M 12,-48 C 22,-52 38,-50 48,-40 C 38,-30 22,-36 12,-48 Z" fill="#f0f4fa" />
      <path d="M 8,-25 C 20,-30 38,-26 48,-15 C 38,-6 20,-12 8,-25 Z" fill="#f0f4fa" />
      <path d="M 2,-2 C 14,-6 30,-2 40,8 C 30,16 14,10 2,-2 Z" fill="#f0f4fa" />
      <path d="M 60,-50 C 56,-75 25,-70 35,-55 Z" fill="#121524" />
    </g>

    <!-- Purple Racing Jacket & Shoulders -->
    <path d="M 68,260 C 65,215 105,200 140,200 C 175,200 215,215 212,260 Z" fill="url(#pJacket)" stroke="#1a0c3b" stroke-width="2.5" />
    <!-- White Racing Stripes on Sleeves -->
    <path d="M 80,260 C 80,230 92,216 102,212" stroke="#48e3cf" stroke-width="4" stroke-linecap="round" fill="none" />
    <path d="M 200,260 C 200,230 188,216 178,212" stroke="#48e3cf" stroke-width="4" stroke-linecap="round" fill="none" />

    <!-- Popcorn Bucket Held in Paw / Front -->
    <g transform="translate(140, 240)">
      <!-- Striped Carnival Bucket -->
      <polygon points="-38,-25 38,-25 30,35 -30,35" fill="#f44336" stroke="#b71c1c" stroke-width="2" />
      <!-- White Stripes on Bucket -->
      <polygon points="-24,-25 -14,-25 -10,35 -18,35" fill="#ffffff" />
      <polygon points="-5,-25 5,-25 5,35 -5,35" fill="#ffffff" />
      <polygon points="14,-25 24,-25 18,35 10,35" fill="#ffffff" />
      <!-- Golden "M" Logo -->
      <circle cx="0" cy="8" r="10" fill="#ffd65a" stroke="#d49411" stroke-width="1.2" />
      <text x="0" y="12.5" font-family="Arial, sans-serif" font-weight="900" font-size="11" fill="#7a1a1a" text-anchor="middle">M</text>

      <!-- Puffed Golden Popcorn Overflowing from Bucket -->
      <circle cx="-25" cy="-28" r="9" fill="#ffea94" stroke="#c48310" stroke-width="1" />
      <circle cx="-12" cy="-33" r="10" fill="#fff5cb" stroke="#c48310" stroke-width="1" />
      <circle cx="4" cy="-35" r="11" fill="#ffe273" stroke="#c48310" stroke-width="1" />
      <circle cx="20" cy="-31" r="10" fill="#fff7d9" stroke="#c48310" stroke-width="1" />
      <circle cx="-2" cy="-26" r="9.5" fill="#ffea94" stroke="#c48310" stroke-width="1" />
      <circle cx="-20" cy="-22" r="8" fill="#fff5cb" stroke="#c48310" stroke-width="1" />
      <circle cx="16" cy="-22" r="8.5" fill="#ffe273" stroke="#c48310" stroke-width="1" />
    </g>

    <!-- Driving Glove Paws Holding Bucket -->
    <ellipse cx="98" cy="225" rx="9" ry="7" fill="#38226e" stroke="#1d103b" stroke-width="1.5" transform="rotate(-15, 98, 225)" />
    <ellipse cx="182" cy="225" rx="9" ry="7" fill="#38226e" stroke="#1d103b" stroke-width="1.5" transform="rotate(15, 182, 225)" />

    <!-- Magenta Neck Scarf Knot & Tails -->
    <path d="M 120,185 C 130,192 150,192 160,185 C 168,198 140,210 120,185 Z" fill="url(#pScarf)" stroke="#66144f" stroke-width="1.5" />
    <path d="M 152,192 C 168,206 182,216 195,212 C 190,202 178,195 160,188 Z" fill="url(#pScarf)" />

    <!-- Rascal's Head & Face -->
    <!-- Raccoon Ears -->
    <!-- Left Ear -->
    <polygon points="85,85 70,40 108,62" fill="#252c4a" stroke="#131726" stroke-width="2" />
    <polygon points="86,75 78,50 102,64" fill="#f2ecde" />
    <!-- Right Ear -->
    <polygon points="195,85 210,40 172,62" fill="#252c4a" stroke="#131726" stroke-width="2" />
    <polygon points="194,75 202,50 178,64" fill="#f2ecde" />

    <!-- Head Base / Fluffy Cheek Contour -->
    <path d="M 85,115 C 68,135 74,170 105,178 C 125,183 155,183 175,178 C 206,170 212,135 195,115 C 185,100 95,100 85,115 Z" fill="#e8edf7" stroke="#191c2b" stroke-width="2" />
    <!-- Cheek Fluff Tufts -->
    <path d="M 72,145 L 82,150 L 70,158 L 84,162 L 76,170 L 98,172" fill="#e8edf7" stroke="#191c2b" stroke-width="1.8" />
    <path d="M 208,145 L 198,150 L 210,158 L 196,162 L 204,170 L 182,172" fill="#e8edf7" stroke="#191c2b" stroke-width="1.8" />

    <!-- Dark Raccoon Eye Mask -->
    <path d="M 90,132 C 102,126 122,130 134,138 C 146,130 166,126 178,132 C 196,140 196,164 176,164 C 158,164 148,150 140,150 C 132,150 122,164 104,164 C 84,164 84,140 90,132 Z" fill="#1b2138" />

    <!-- Big Expressive Cartoon Eyes (Feminine with subtle eyelashes) -->
    <!-- Left Eye -->
    <ellipse cx="114" cy="144" rx="10.5" ry="12" fill="#ffffff" />
    <ellipse cx="116" cy="144" rx="7" ry="8.5" fill="#3d2112" />
    <ellipse cx="117" cy="144" rx="4.5" ry="5.5" fill="#120a05" />
    <!-- Eye Highlights -->
    <circle cx="114" cy="140" r="3" fill="#ffffff" />
    <circle cx="118" cy="147" r="1.5" fill="#ffffff" />
    <!-- Eyelashes -->
    <path d="M 104,136 Q 102,130 106,128" stroke="#120a05" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M 112,133 Q 112,126 116,125" stroke="#120a05" stroke-width="2.2" stroke-linecap="round" fill="none" />
    <path d="M 121,134 Q 124,128 128,129" stroke="#120a05" stroke-width="1.8" stroke-linecap="round" fill="none" />

    <!-- Right Eye (Playful Wink or Wide Sparkle Eye) -->
    <ellipse cx="166" cy="144" rx="10.5" ry="12" fill="#ffffff" />
    <ellipse cx="164" cy="144" rx="7" ry="8.5" fill="#3d2112" />
    <ellipse cx="163" cy="144" rx="4.5" ry="5.5" fill="#120a05" />
    <!-- Eye Highlights -->
    <circle cx="162" cy="140" r="3" fill="#ffffff" />
    <circle cx="166" cy="147" r="1.5" fill="#ffffff" />
    <!-- Eyelashes -->
    <path d="M 159,134 Q 156,128 152,129" stroke="#120a05" stroke-width="1.8" stroke-linecap="round" fill="none" />
    <path d="M 168,133 Q 168,126 164,125" stroke="#120a05" stroke-width="2.2" stroke-linecap="round" fill="none" />
    <path d="M 176,136 Q 178,130 174,128" stroke="#120a05" stroke-width="2" stroke-linecap="round" fill="none" />

    <!-- Cute Rosy Cartoon Cheeks -->
    <ellipse cx="94" cy="162" rx="7" ry="4.5" fill="#ff7da7" opacity="0.65" />
    <ellipse cx="186" cy="162" rx="7" ry="4.5" fill="#ff7da7" opacity="0.65" />

    <!-- Snout & Mischievous Grin -->
    <ellipse cx="140" cy="164" rx="15" ry="12" fill="#ffffff" />
    <!-- Cute Button Nose -->
    <polygon points="135,156 145,156 140,161" fill="#1b1d2e" stroke="#1b1d2e" stroke-linejoin="round" stroke-width="2" />
    <!-- Mischievous Smirk / Grin -->
    <path d="M 132,166 C 136,173 144,173 151,168" stroke="#1b1d2e" stroke-width="2" stroke-linecap="round" fill="none" />
    <!-- Little fang / tooth peeking out -->
    <polygon points="144,170 148,170 146,173" fill="#ffffff" />

    <!-- Whiskers -->
    <line x1="88" y1="162" x2="68" y2="160" stroke="#717a94" stroke-width="1.2" stroke-linecap="round" />
    <line x1="88" y1="166" x2="70" y2="170" stroke="#717a94" stroke-width="1.2" stroke-linecap="round" />
    <line x1="192" y1="162" x2="212" y2="160" stroke="#717a94" stroke-width="1.2" stroke-linecap="round" />
    <line x1="192" y1="166" x2="210" y2="170" stroke="#717a94" stroke-width="1.2" stroke-linecap="round" />

    <!-- Oversized Yellow Delivery Helmet -->
    <!-- Helmet Dome -->
    <path d="M 72,112 C 68,52 212,52 208,112 C 204,118 76,118 72,112 Z" fill="url(#pYellowHelmet)" stroke="#9c5d03" stroke-width="3" />
    <!-- Helmet Front Visor Brim -->
    <path d="M 68,112 C 100,122 180,122 212,112 C 216,118 206,124 140,126 C 74,124 64,118 68,112 Z" fill="#cf7802" stroke="#784400" stroke-width="2" />
    <!-- Helmet Center Racing Stripe -->
    <path d="M 133,54 C 133,54 132,118 132,118 L 148,118 L 147,54 Z" fill="#ffffff" opacity="0.85" />
    <!-- Helmet Gloss Shine -->
    <path d="M 88,72 C 102,62 130,58 142,59 C 136,65 112,68 96,80 Z" fill="#ffffff" opacity="0.55" />

    <!-- Swept Fur Tuft escaping playfully under helmet visor on the left -->
    <path d="M 88,114 C 80,124 82,136 94,132 C 90,126 94,120 98,117 Z" fill="#f4f0e4" stroke="#c2baa6" stroke-width="1" />
  </g>
</svg>
