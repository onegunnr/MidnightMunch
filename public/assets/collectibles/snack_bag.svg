<svg xmlns="http://www.w3.org/2000/svg" viewBox="-26 -30 52 60" width="52" height="60">
  <defs>
    <linearGradient id="bagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3b353" />
      <stop offset="40%" stop-color="#e0952d" />
      <stop offset="100%" stop-color="#b86b11" />
    </linearGradient>
    <linearGradient id="tealBadge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2de3c8" />
      <stop offset="100%" stop-color="#14a38f" />
    </linearGradient>
    <filter id="frenzyGlow" x="-35%" y="-30%" width="170%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#46edd4" flood-opacity="0.75" />
    </filter>
  </defs>

  <g filter="url(#frenzyGlow)">
    <!-- Bag Ribbon / Handles -->
    <path d="M -10,-18 C -14,-29 14,-29 10,-18" stroke="#ffe58f" stroke-width="3" fill="none" stroke-linecap="round" />

    <!-- Paper Bag Body -->
    <path d="M -18,-16 L 18,-16 L 15,22 L -15,22 Z" fill="url(#bagGrad)" stroke="#874706" stroke-width="1.5" />
    <!-- Folded Paper Top Lip -->
    <polygon points="-19,-17 19,-17 17,-12 -17,-12" fill="#fed678" stroke="#874706" stroke-width="1.2" />

    <!-- Star Badge / Label -->
    <rect x="-13" y="-6" width="26" height="20" rx="4" fill="url(#tealBadge)" stroke="#096357" stroke-width="1" />

    <!-- Star Emblem on Badge -->
    <polygon points="0,-3 2,1 6,1 3,4 4,8 0,5 -4,8 -3,4 -6,1 -2,1" fill="#fff5cb" stroke="#cf9c19" stroke-width="0.6" />

    <!-- "MUNCH" Text -->
    <text x="0" y="11" font-family="Arial, sans-serif" font-weight="900" font-size="6.5" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">MUNCH</text>

    <!-- Side Crease Lines -->
    <line x1="-12" y1="-12" x2="-9" y2="20" stroke="#a15908" stroke-width="1" opacity="0.4" />
    <line x1="12" y1="-12" x2="9" y2="20" stroke="#a15908" stroke-width="1" opacity="0.4" />
  </g>
</svg>
