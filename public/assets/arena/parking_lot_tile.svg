<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" width="900" height="900">
  <defs>
    <!-- Asphalt Texture / Pattern -->
    <pattern id="asphaltGrit" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#222336" />
      <circle cx="8" cy="12" r="1.5" fill="#1b1c2b" />
      <circle cx="28" cy="24" r="1.8" fill="#2d2e47" />
      <circle cx="34" cy="8" r="1.2" fill="#1b1c2b" />
      <circle cx="16" cy="32" r="1.5" fill="#2d2e47" />
      <circle cx="22" cy="18" r="1" fill="#171824" />
    </pattern>
    <linearGradient id="curbBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f4570" />
      <stop offset="100%" stop-color="#2a2342" />
    </linearGradient>
  </defs>

  <!-- Base Dark Pavement -->
  <rect x="0" y="0" width="900" height="900" fill="url(#asphaltGrit)" />

  <!-- Outer Track Boundary Curb Line -->
  <rect x="18" y="18" width="864" height="864" rx="16" fill="none" stroke="url(#curbBorder)" stroke-width="18" />
  <rect x="27" y="27" width="846" height="846" rx="8" fill="none" stroke="#675b8a" stroke-width="2" opacity="0.4" />

  <!-- Tire Drift Skid Marks (Baked in for authentic race feel) -->
  <g opacity="0.28" stroke="#12131f" stroke-linecap="round" fill="none">
    <!-- Center Drift Circle Arc -->
    <path d="M 400,380 A 130,130 0 0,1 550,480" stroke-width="12" stroke-dasharray="24,12" />
    <path d="M 416,392 A 114,114 0 0,1 538,474" stroke-width="10" stroke-dasharray="20,14" />
    <!-- Corner Drift Smudges -->
    <path d="M 120,240 Q 220,180 320,190" stroke-width="14" stroke-dasharray="32,16" />
    <path d="M 780,660 Q 680,720 580,710" stroke-width="14" stroke-dasharray="32,16" />
    <path d="M 690,210 Q 720,310 680,410" stroke-width="12" stroke-dasharray="28,14" />
    <path d="M 210,690 Q 180,590 220,490" stroke-width="12" stroke-dasharray="28,14" />
  </g>

  <!-- Painted Parking Stalls & Lane Dividers -->
  <g stroke="rgba(255, 255, 255, 0.18)" stroke-width="4" stroke-linecap="round">
    <!-- North & South Parking Lines -->
    <line x1="120" y1="36" x2="120" y2="150" />
    <line x1="240" y1="36" x2="240" y2="150" />
    <line x1="360" y1="36" x2="360" y2="150" />
    <line x1="540" y1="36" x2="540" y2="150" />
    <line x1="660" y1="36" x2="660" y2="150" />
    <line x1="780" y1="36" x2="780" y2="150" />

    <line x1="120" y1="750" x2="120" y2="864" />
    <line x1="240" y1="750" x2="240" y2="864" />
    <line x1="360" y1="750" x2="360" y2="864" />
    <line x1="540" y1="750" x2="540" y2="864" />
    <line x1="660" y1="750" x2="660" y2="864" />
    <line x1="780" y1="750" x2="780" y2="864" />
  </g>

  <!-- Central Driving Corridor Dashed Guidance Lines -->
  <g stroke="rgba(255, 218, 92, 0.28)" stroke-width="4" stroke-dasharray="28, 24">
    <line x1="80" y1="310" x2="820" y2="310" />
    <line x1="80" y1="590" x2="820" y2="590" />
    <line x1="310" y1="80" x2="310" y2="820" />
    <line x1="590" y1="80" x2="590" y2="820" />
  </g>

  <!-- Directional Asphalt Painted Chevrons in Traffic Flow -->
  <g fill="none" stroke="rgba(255, 255, 255, 0.22)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 430,300 L 450,285 L 470,300" />
    <path d="M 430,600 L 450,615 L 470,600" />
    <path d="M 300,430 L 285,450 L 300,470" />
    <path d="M 600,430 L 615,450 L 600,470" />
  </g>

  <!-- Corner Hazard Striping (Red/White & Yellow/Black bumpers) -->
  <g stroke-width="7">
    <!-- Top-Left Corner Stripes -->
    <line x1="36" y1="90" x2="90" y2="36" stroke="#ef4765" />
    <line x1="36" y1="120" x2="120" y2="36" stroke="#ffffff" opacity="0.8" />
    <line x1="36" y1="150" x2="150" y2="36" stroke="#ef4765" />
    
    <!-- Top-Right Corner Stripes -->
    <line x1="864" y1="90" x2="810" y2="36" stroke="#ffcf57" />
    <line x1="864" y1="120" x2="780" y2="36" stroke="#252438" />
    <line x1="864" y1="150" x2="750" y2="36" stroke="#ffcf57" />

    <!-- Bottom-Left Corner Stripes -->
    <line x1="36" y1="810" x2="90" y2="864" stroke="#ffcf57" />
    <line x1="36" y1="780" x2="120" y2="864" stroke="#252438" />
    <line x1="36" y1="750" x2="150" y2="864" stroke="#ffcf57" />

    <!-- Bottom-Right Corner Stripes -->
    <line x1="864" y1="810" x2="810" y2="864" stroke="#ef4765" />
    <line x1="864" y1="780" x2="780" y2="864" stroke="#ffffff" opacity="0.8" />
    <line x1="864" y1="750" x2="750" y2="864" stroke="#ef4765" />
  </g>
</svg>
